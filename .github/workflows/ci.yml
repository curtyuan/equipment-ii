name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.mod

      - name: Install legacy test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh tmux fzf

      - name: Go and public contract tests
        run: make test

      - name: Legacy automatic baseline
        run: make test-legacy

      - name: Tmux integration contracts
        run: make test-entry-tmux test-variables-tmux test-variable-output-tmux test-variable-mutations-tmux test-set-tmux test-unset-all-tmux test-load-all-tmux test-get-tmux test-interactive-tmux test-clipboard-tmux test-tmux-status test-payload-render-tmux test-payload-select-tmux test-payload-input-usage-tmux test-legacy-tmux

      - name: Linux cross-build
        run: make cross-build

      - name: Go deployment package
        run: make
