name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(<VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            printf 'VERSION (%s) must match tag (%s)\n' "$version" "$tag" >&2
            exit 1
          fi

      - name: Build architecture-specific deployment packages
        run: make package-linux-amd64 package-linux-arm64

      - name: Create archives
        shell: bash
        run: |
          set -euo pipefail
          version="$(<VERSION)"
          mkdir -p dist
          for arch in amd64 arm64; do
            package_root="export/linux-${arch}"
            tar -C "$package_root" -czf \
              "dist/ii-${version}-linux-${arch}.tar.gz" ii
            (
              cd "$package_root"
              zip -qr "../../dist/ii-${version}-linux-${arch}.zip" ii
            )
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
