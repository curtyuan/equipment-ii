# ii configuration example.
#
# ii.plugin.zsh reads ~/.config/ii/ii.conf by default. Copy this file there, or
# set II_CONFIG_FILE in ~/.zshrc before sourcing ii.plugin.zsh to use another
# path:
#
#   export II_CONFIG_FILE="$HOME/.config/ii/work.conf"
#
# II_EXPORT_CASE controls which shell variable names `ii set` and `ii load`
# export from tmux workflow variables.
#
# Available values:
#   lower  export lowercase names only, such as lhost. This is the default.
#   upper  export uppercase names only, such as LHOST.
#   both   export both lowercase and uppercase names, such as lhost and LHOST.

export II_EXPORT_CASE=lower

# II_COLOR controls ANSI colors in terminal output.
#
# Available values:
#   auto    use color for terminals and ANSI-aware selector streams (default)
#   always  always emit ANSI colors
#   never   never emit ANSI colors
#
# A non-empty NO_COLOR disables color regardless of II_COLOR, following the
# NO_COLOR convention.

export II_COLOR=auto

# II_AUTO_DETECT_LHOST controls whether `ii s:rhost=...` automatically detects
# and sets lhost after rhost/rhosts is set. Enabled by default.
#
# Disable it when you prefer to manage lhost manually:
#
#   export II_AUTO_DETECT_LHOST=0
#
# II_AUTO_DETECT_LHOST_INTERFACE controls which network interface is used for
# automatic lhost detection. The default is tun0.

export II_AUTO_DETECT_LHOST=1
export II_AUTO_DETECT_LHOST_INTERFACE=tun0

# The native tmux :ii command alias is installed automatically when the plugin
# loads inside tmux. Disable automatic installation with:
#
#   export II_TMUX_INTEGRATION=0
#
# If another command alias owns the name ii, it is preserved by default. To
# explicitly replace that conflicting alias:
#
#   export II_TMUX_INTEGRATION_FORCE=1

export II_TMUX_INTEGRATION=1
export II_TMUX_INTEGRATION_FORCE=0

# II_WWW_ROOT is reserved for the planned `ii p -w ...` web helpers. The
# default will remain /www.
#
# export II_WWW_ROOT=/www
