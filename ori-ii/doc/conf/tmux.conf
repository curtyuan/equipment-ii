# tmux clipboard settings relevant to ii.
#
# ii's default OSC52 backend uses `tmux load-buffer -w -` inside tmux. These
# options let tmux attempt clipboard integration through the attached terminal.
set -g set-clipboard external
set -g allow-passthrough off

# Reference copy-mode binding for VMware/Kali sessions where updating both X
# selections is required for clipboard sharing to reach the host.
#
# ii exposes the same behavior through:
#
#   export II_CLIP_BACKEND=xclip-both
#
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"
